name: Module 1 Snapshot (Macro · MSTR · Preferreds)

on:
  schedule:
    # 每 6 小时重建一次 Module 1 数据集；线上实例冷启动时读取这份快照，避免退回部署时的旧数据
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 只用 Node 内置模块，无需 npm install
      - name: Rebuild Module 1 datasets
        id: build
        env:
          # SEC submissions 索引要求申报方自带身份 (vars.SEC_USER_AGENT，含联系邮箱)
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: node scripts/macro_snapshot.js

      - name: Upload disclosure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: mstr-disclosure-evidence
          path: data/mstr_disclosure_evidence/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit and push
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/macro_chart.json data/mstr_preferreds_cache.json data/job_health_macro_snapshot.json
          # 披露快照是可选新产物：缺失不阻塞其它部分产物的提交
          if [ -f data/mstr_disclosures.json ]; then git add data/mstr_disclosures.json; fi
          # STRC 月度股息率历史只能靠逐期采集累积，必须随快照提交才能跨部署保留
          if [ -f data/strc_rate_history.json ]; then git add data/strc_rate_history.json; fi
          if git diff --cached --quiet; then
            echo "No changes; skipping commit."
            exit 0
          fi
          # [skip render] 避免触发 Render 重新部署；线上从 GitHub raw 读取最新快照
          git commit -m "chore(macro): module 1 dataset snapshot [skip ci] [skip render]"
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then pushed=1; break; fi
            sleep 8
          done
          [ "$pushed" = 1 ]
