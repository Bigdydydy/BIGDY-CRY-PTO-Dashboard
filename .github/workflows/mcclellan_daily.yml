name: Crypto McClellan Daily Update

on:
  schedule:
    # 收盘后多个时段各排一次（避开整点高峰，GitHub 高峰期会延迟甚至丢弃定时任务）。
    # 报价按实际 UTC 采集日和采样时间记录，不冒充固定时点的 UTC 收盘；
    # 第一次成功采集即定稿，之后的时段直接跳过、不产生提交 (--skip-if-final)
    - cron: '37 0 * * *'
    - cron: '37 3 * * *'
    - cron: '37 6 * * *'
    - cron: '37 9 * * *'
  workflow_dispatch: # 允许在 Actions 页面手动触发补跑
    inputs:
      force:
        description: '即使当天已定稿也重新采集'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mcclellan-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node for producer heartbeat
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pipeline is stdlib-only: no dependency install step
      - name: Unit tests
        working-directory: scripts/crypto_mcclellan
        run: python test_breadth.py

      - name: Run breadth pipeline (collect + compute + export JSON)
        id: pipeline
        working-directory: scripts/crypto_mcclellan
        run: python export_to_json.py ${{ inputs.force && ' ' || '--skip-if-final' }}

      - name: Record producer outcome without renewing source dates
        if: ${{ !cancelled() && steps.pipeline.outcome != 'skipped' }}
        env:
          PIPELINE_OUTCOME: ${{ steps.pipeline.outcome }}
        run: node scripts/record_pipeline_result.js mcclellan_daily

      # Commit whatever was collected even when one source failed (the pipeline
      # step is then red and GitHub notifies the owner)
      - name: Commit and push updated dataset
        if: ${{ !cancelled() && steps.pipeline.outcome != 'skipped' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crypto_mcclellan.json data/job_health_mcclellan_daily.json \
                  scripts/crypto_mcclellan/data/
          if git diff --cached --quiet; then
            echo "No data changes; skipping commit."
          else
            git commit -m "chore(mcclellan): daily breadth data update [skip ci]"
            # main may have moved while the pipeline ran; rebase and retry
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              sleep 10
            done
            [ "$pushed" = 1 ]
          fi
