name: Module 4B Daily (Option OI · Block Flow · Smart Money)

on:
  schedule:
    # Deribit 期权 08:00 UTC 交割，交割后采样当天的 OI 基线并给大额结构盯市。GitHub 的定时任务经常延迟或整段丢弃，
    # 所以排了多个时段；OI 当天已采过时直接跳过 (--skip-if-done)，4B 日更各步骤幂等，重复运行只补缺失部分。
    - cron: '17,41 8 * * *'
    - cron: '13 9,11,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: block-insight-daily
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 取 main 最新提交，确保同一天前一次运行的提交可见
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 只用 Node 内置模块，无需 npm install
      - name: Snapshot Deribit option open interest
        id: option_oi
        run: node scripts/option_oi_snapshot.js --skip-if-done

      - name: Block flow daily aggregates and smart-money marks
        id: block_flow
        if: ${{ !cancelled() }}
        env:
          OPTION_OI_STEP_OUTCOME: ${{ steps.option_oi.outcome }}
        run: node scripts/block_insight_daily.js

      # 大宗归档对账 (补采集漏掉的腿) + 期货 / 永续对冲腿 + 按含对冲的净 Delta 迁移聪明钱登记；失败不影响上面的提交
      - name: Block hedge legs and archive reconciliation
        id: block_hedges
        if: ${{ !cancelled() && steps.block_flow.outcome != 'skipped' }}
        continue-on-error: true
        run: node scripts/block_hedges_sync.js --days 3

      # 期权每日 08:00 UTC mark 快照 (从逐笔成交还原)，供大宗结构的 markout 估值
      - name: Daily option marks from the trade tape
        id: option_marks
        if: ${{ !cancelled() && steps.block_flow.outcome != 'skipped' }}
        continue-on-error: true
        run: node scripts/option_marks_history.js --days 3

      # 聪明钱登记的 +1 / +7 天 markout (依赖上一步的 mark 快照)
      - name: Smart-money markouts
        id: markouts
        if: ${{ !cancelled() && steps.option_marks.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/block_markouts.js

      - name: Commit and push
        if: ${{ !cancelled() && steps.block_flow.outcome != 'skipped' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/block_trades_BTC.json data/block_trades_archive data/block_hedges_BTC.json data/option_marks_daily data/option_oi_history_BTC.json data/block_flow_daily_BTC.json data/smart_money_BTC.json data/job_health_block_insight_daily.json
          if git diff --cached --quiet; then
            echo "No changes; skipping commit."
            exit 0
          fi
          # [skip render] 避免触发 Render 重新部署；线上从 GitHub raw 读取最新档案
          git commit -m "chore(4b): daily option OI, block flow aggregates and smart-money marks [skip ci] [skip render]"
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then pushed=1; break; fi
            sleep 8
          done
          [ "$pushed" = 1 ]
