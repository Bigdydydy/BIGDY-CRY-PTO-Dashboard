name: Offline regression tests
on:
  push:
    paths-ignore:
      - 'data/**'
      - 'scripts/crypto_mcclellan/data/**'
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: python -m unittest discover -s scripts/crypto_mcclellan -p 'test_*.py'
