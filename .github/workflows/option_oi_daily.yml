name: Deribit Option OI Daily Snapshot

on:
  schedule:
    # Deribit 期权 08:00 UTC 交割，交割后采样当天的 OI 基线。GitHub 的定时任务经常延迟或整段丢弃，
    # 所以排了多个时段；当天已采过时后续时段直接跳过、不产生提交 (--skip-if-done)。
    - cron: '17,41 8 * * *'
    - cron: '13 9,11,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: option-oi-daily
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 取 main 最新提交，确保同一天前一次运行的提交可见，--skip-if-done 才能生效
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 只用 Node 内置模块，无需 npm install
      - name: Snapshot Deribit option open interest
        run: node scripts/option_oi_snapshot.js --skip-if-done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/option_oi_history_BTC.json
          if git diff --cached --quiet; then
            echo "No changes; skipping commit."
            exit 0
          fi
          # [skip render] 避免触发 Render 重新部署；线上从 GitHub raw 读取最新档案
          git commit -m "chore(options-oi): daily open interest snapshot [skip ci] [skip render]"
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then pushed=1; break; fi
            sleep 8
          done
          [ "$pushed" = 1 ]
