name: Data Source Health Monitor

on:
  schedule:
    - cron: '49 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-source-health
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest snapshots
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check producer heartbeats and actual source dates
        id: health
        continue-on-error: true
        env:
          DASHBOARD_HEALTH_URL: ${{ vars.DASHBOARD_HEALTH_URL }}
        run: node scripts/data_health_check.js --output "$RUNNER_TEMP/data-health-report.json"

      - name: Retain diagnostic report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: data-health-report
          path: ${{ runner.temp }}/data-health-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Optional configured webhook
        if: ${{ !cancelled() && steps.health.outcome == 'failure' }}
        env:
          DATA_HEALTH_WEBHOOK_URL: ${{ secrets.DATA_HEALTH_WEBHOOK_URL }}
        run: node scripts/data_health_alert.js "$RUNNER_TEMP/data-health-report.json"

      - name: Fail visibly on incomplete or unhealthy coverage
        if: ${{ !cancelled() && steps.health.outcome != 'success' }}
        run: exit 1
