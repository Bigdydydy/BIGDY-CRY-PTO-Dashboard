services:
  - type: web
    name: greeks-quant-dashboard
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm test
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # X-Forwarded-For on Render arrives as [client, Cloudflare edge, Render
      # internal proxy] (confirmed from production logs 2026-11-17), so the
      # visitor is the third entry from the right.
      - key: TRUST_PROXY_HOPS
        value: "3"
